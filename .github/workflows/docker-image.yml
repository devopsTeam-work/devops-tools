name: Docker Image CI

on:
  push:
    branches: [ "**" ] # ירוץ על כל push בכל בראנץ'
    tags:
      - '*'
permissions:
  contents: write # שונה ל-write כדי לאפשר לדחוף ברנצ'ים וטאגים חדשים
  security-events: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: show tag name
          run: echo "$GITHUB_REF_NAME"

        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0 # חשוב כדי שנוכל לייצר ברנצ'ים ולדחוף אותם
            token: ${{ secrets.GH_PAT }} # שימוש ב-PAT מורשה שמפעיל Triggers
            
        - name: Set dynamic tag
          run: echo "TAG_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
    
        # התחברות ישירה ל-Docker Hub באמצעות ה-Secrets שלך
        - name: Login to Docker Hub
          run: echo "${{ secrets.DEVOPS_TEAM_PASSWORD }}" | docker login -u "${{ secrets.DEVOPS_TEAM_USERNAME }}" --password-stdin
    
        # בניית האימג' עם השם המלא של ה-Repository שלך ב-Docker Hub
        - name: Build the Docker image
          run: |
            docker build . \
              --file Dockerfile \
              --tag ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:$GITHUB_REF_NAME \
              --tag ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:latest
    
        # דחיפה (Push) של האימג' ל-Docker Hub
        - name: Push Docker image
          if: startsWith(github.ref, 'refs/tags/')
          run: |
            docker push ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:$GITHUB_REF_NAME
            docker push ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:latest
            
        - name: Run Trivy Scanner (SARIF Output)
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: "${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:latest"
            format: 'sarif'
            output: 'trivy-results.sarif'
            severity: 'CRITICAL,HIGH'

        - name: Upload Trivy Results to GitHub Security Tab
          uses: github/codeql-action/upload-sarif@v4
          with:
            sarif_file: 'trivy-results.sarif'

        # ==========================================
        # שלבי התיקון האוטומטי באמצעות Gemini API
        # ==========================================

        - name: Setup Python
          if: ${{ !endsWith(github.ref_name, '_gemini_scan') }}
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Analyze vulnerabilities with Gemini
          if: ${{ !endsWith(github.ref_name, '_gemini_scan') }}
          env:
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          run: |
            pip install -q google-genai
        
            python -u - << 'EOF'
            import os
            import json
            import time
            import re
            from google import genai
            from google.genai.errors import APIError
        
            MODEL = "gemini-3.5-flash-lite"
        
            client = genai.Client(
                api_key=os.environ["GEMINI_API_KEY"]
            )
        
            # ------------------------------------------------------------
            # Read Dockerfile
            # ------------------------------------------------------------
        
            with open("dockerfile", "r") as f:
                dockerfile = f.read()
        
            # ------------------------------------------------------------
            # Parse SARIF
            # ------------------------------------------------------------
        
            findings = []
        
            with open("trivy-results.sarif", "r") as f:
                sarif = json.load(f)
        
            for run in sarif.get("runs", []):
        
                rules = {}
        
                for rule in run.get("tool", {}).get("driver", {}).get("rules", []):
                    rule_id = rule.get("id")
        
                    properties = rule.get("properties", {}) or {}
        
                    rules[rule_id] = {
                        "severity": (
                            properties.get("severity")
                            or properties.get("security-severity")
                            or ""
                        )
                    }
        
                for result in run.get("results", []):
        
                    rule_id = result.get("ruleId", "UNKNOWN")
        
                    message = (
                        result.get("message", {})
                        .get("text", "")
                    )
        
                    severity = rules.get(
                        rule_id,
                        {}
                    ).get("severity", "")
        
                    findings.append({
                        "cve": rule_id,
                        "severity": severity,
                        "message": message
                    })
        
            # ------------------------------------------------------------
            # Extract useful information from Trivy messages
            # ------------------------------------------------------------
        
            compact = []
        
            for finding in findings:
        
                message = finding["message"]
        
                installed = None
                fixed = None
                package = None
        
                m = re.search(
                    r"Package:\s*([^\s]+)",
                    message,
                    re.IGNORECASE
                )
        
                if m:
                    package = m.group(1)
        
                m = re.search(
                    r"Installed Version:\s*([^\s]+)",
                    message,
                    re.IGNORECASE
                )
        
                if m:
                    installed = m.group(1)
        
                m = re.search(
                    r"Fixed Version:\s*([^\s]+)",
                    message,
                    re.IGNORECASE
                )
        
                if m:
                    fixed = m.group(1)
        
                compact.append({
                    "cve": finding["cve"],
                    "severity": finding["severity"],
                    "package": package,
                    "installed_version": installed,
                    "fixed_version": fixed
                })
        
            # ------------------------------------------------------------
            # Deduplicate
            # ------------------------------------------------------------
        
            unique = {}
        
            for item in compact:
        
                key = (
                    item["cve"],
                    item["package"],
                    item["installed_version"],
                    item["fixed_version"]
                )
        
                unique[key] = item
        
            compact = list(unique.values())
        
            print("==================================================")
            print(f"Trivy findings: {len(findings)}")
            print(f"Unique findings: {len(compact)}")
            print("==================================================")
        
            # ------------------------------------------------------------
            # Gemini
            # ------------------------------------------------------------
        
            prompt = f"""
            You are a Senior DevOps and Cyber Security Engineer.
            
            Analyze the Trivy findings below and determine how each vulnerability
            could be remediated.
            
            IMPORTANT:
            
            The vulnerable package may come from:
            
            1. Dockerfile
            2. go.mod / Go dependency
            3. base image
            4. compiled binary
            5. another dependency source
            
            DO NOT assume that every vulnerability can be fixed by changing
            the Dockerfile.
            
            For every package, determine the most likely source.
            
            Allowed source values:
            
            - "dockerfile"
            - "go.mod"
            - "base_image"
            - "binary"
            - "unknown"
            
            Rules:
            
            1. Only recommend real, stable versions.
            2. Never invent versions.
            3. Prefer the smallest stable version that fixes the vulnerabilities.
            4. Preserve compatibility.
            5. If the vulnerability is inside a compiled binary and cannot safely
               be changed directly from the Dockerfile, mark source as "binary".
            6. If there is not enough information to determine the source,
               mark source as "unknown".
            7. Do not return a Dockerfile.
            8. Do not return markdown.
            9. Return ONLY valid JSON.
            
            Return exactly:
            
            {{
              "updates": [
                {{
                  "package": "package-name",
                  "installed_version": "current",
                  "target_version": "target",
                  "source": "dockerfile|go.mod|base_image|binary|unknown",
                  "confidence": "high|medium|low",
                  "reason": "short explanation"
                }}
              ]
            }}
            
            Trivy findings:
            
            {json.dumps(compact, indent=2)}
            """
        
            print("==================================================")
            print("Sending vulnerability metadata to Gemini")
            print("==================================================")
        
            # ------------------------------------------------------------
            # Token count
            # ------------------------------------------------------------
        
            try:
                token_count = client.models.count_tokens(
                    model=MODEL,
                    contents=prompt
                )
        
                print(
                    f"Gemini input tokens: "
                    f"{token_count.total_tokens}"
                )
        
            except Exception as e:
                print(
                    f"Could not calculate token count: {e}"
                )
        
            # ------------------------------------------------------------
            # Call Gemini
            # ------------------------------------------------------------
        
            result = None
        
            for attempt in range(4):
        
                try:
        
                    response = client.models.generate_content(
                        model=MODEL,
                        contents=prompt,
                        config={
                            "response_mime_type": "application/json",
                            "temperature": 0
                        }
                    )
        
                    result = json.loads(
                        response.text
                    )
        
                    break
        
                except APIError as e:
        
                    wait = (attempt + 1) * 40
        
                    print(
                        f"Gemini API error: {e}"
                    )
        
                    print(
                        f"Retrying in {wait}s..."
                    )
        
                    time.sleep(wait)
        
                except Exception as e:
        
                    print(
                        f"Gemini error: {e}"
                    )
        
                    if attempt == 3:
                        raise
        
                    time.sleep(15)
        
            if not result:
                raise Exception(
                    "Gemini did not return a valid response"
                )
        
            updates = result.get("updates", [])
        
            print("==================================================")
            print("Gemini recommendations")
            print("==================================================")
        
            for update in updates:
        
                print(
                    f'{update.get("package")}: '
                    f'{update.get("installed_version")} -> '
                    f'{update.get("target_version")} '
                    f'[{update.get("source")}]'
                )
        
            # ------------------------------------------------------------
            # Save Gemini result
            # ------------------------------------------------------------
        
            with open(
                "gemini-updates.json",
                "w"
            ) as f:
        
                json.dump(
                    result,
                    f,
                    indent=2
                )
        
            print("==================================================")
            print(
                f"Gemini suggested {len(updates)} updates"
            )
            print(
                "Saved to gemini-updates.json"
            )
            print("==================================================")
        
            EOF
            
        - name: Apply Gemini Dockerfile updates
          if: ${{ !endsWith(github.ref_name, '_gemini_scan') }}
          run: |
            python -u - << 'EOF'
            import json
            import re
        
            DOCKERFILE = "dockerfile"
            NEW_DOCKERFILE = "dockerfile.new"
        
            with open(DOCKERFILE, "r") as f:
                original = f.read()
        
            with open("gemini-updates.json", "r") as f:
                data = json.load(f)
        
            updates = data.get("updates", [])
        
            print("==================================================")
            print("Applying Gemini recommendations")
            print("==================================================")
        
            print(
                f"Total Gemini recommendations: "
                f"{len(updates)}"
            )
        
            dockerfile_updates = [
                u for u in updates
                if u.get("source") == "dockerfile"
            ]
        
            print(
                f"Dockerfile updates: "
                f"{len(dockerfile_updates)}"
            )
        
            updated = original
        
            applied = []
            skipped = []
        
            for update in dockerfile_updates:
        
                package = update.get("package")
                old = update.get("installed_version")
                new = update.get("target_version")
        
                if not old or not new:
        
                    skipped.append({
                        "package": package,
                        "reason": "Missing version"
                    })
        
                    continue
        
                # Exact version match
                pattern = re.escape(old)
        
                matches = list(
                    re.finditer(
                        pattern,
                        updated
                    )
                )
        
                if not matches:
        
                    print(
                        f'WARNING: Version "{old}" not found '
                        f'in Dockerfile for {package}'
                    )
        
                    skipped.append({
                        "package": package,
                        "old": old,
                        "new": new,
                        "reason": "Version not found in Dockerfile"
                    })
        
                    continue
        
                if len(matches) > 1:
        
                    print(
                        f'WARNING: Version "{old}" appears '
                        f'{len(matches)} times for {package}'
                    )
        
                    skipped.append({
                        "package": package,
                        "old": old,
                        "new": new,
                        "reason": "Version appears multiple times"
                    })
        
                    continue
        
                updated = re.sub(
                    pattern,
                    new,
                    updated,
                    count=1
                )
        
                applied.append({
                    "package": package,
                    "old": old,
                    "new": new
                })
        
                print(
                    f"✓ {package}: "
                    f"{old} -> {new}"
                )
        
            # ------------------------------------------------------------
            # Save result
            # ------------------------------------------------------------
        
            with open(
                NEW_DOCKERFILE,
                "w"
            ) as f:
        
                f.write(updated)
        
            # ------------------------------------------------------------
            # Summary
            # ------------------------------------------------------------
        
            print("")
            print("==================================================")
            print("UPDATE SUMMARY")
            print("==================================================")
        
            print(
                f"Gemini recommendations : {len(updates)}"
            )
        
            print(
                f"Dockerfile candidates  : "
                f"{len(dockerfile_updates)}"
            )
        
            print(
                f"Applied                 : "
                f"{len(applied)}"
            )
        
            print(
                f"Skipped                 : "
                f"{len(skipped)}"
            )
        
            print("==================================================")
        
            if skipped:
        
                print("")
                print("Skipped updates:")
        
                for item in skipped:
                    print(
                        f'- {item["package"]}: '
                        f'{item["reason"]}'
                    )
        
            EOF
            
        - name: Commit and push Gemini Dockerfile changes
          if: ${{ !endsWith(github.ref_name, '_gemini_scan') }}
          run: |
            echo "=== Diff between Original and Gemini's Suggestion ==="
        
            diff -u dockerfile dockerfile.new || true
        
            # ------------------------------------------------------------
            # Check if Dockerfile actually changed
            # ------------------------------------------------------------
        
            if cmp -s dockerfile dockerfile.new; then
        
              echo "=================================================="
              echo "No applicable Dockerfile changes."
              echo "=================================================="
        
              if [[ -f gemini-updates.json ]]; then
                echo "Gemini recommendations existed,"
                echo "but none resulted in Dockerfile changes."
              fi
        
              exit 0
            fi
        
            # ------------------------------------------------------------
            # Replace Dockerfile
            # ------------------------------------------------------------
        
            mv dockerfile.new dockerfile
        
            # ------------------------------------------------------------
            # Git config
            # ------------------------------------------------------------
        
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
        
            NEW_REF="${GITHUB_REF_NAME}_gemini_scan"
        
            # ------------------------------------------------------------
            # Push
            # ------------------------------------------------------------
        
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
        
              echo "Triggered by Tag."
              echo "Creating branch: $NEW_REF"
        
              git checkout -b "$NEW_REF"
        
              git add dockerfile
        
              git commit \
                -m "chore: secure dockerfile versions via Gemini (Tag: $GITHUB_REF_NAME)"
        
              git push origin "$NEW_REF"
        
              echo "Creating tag: $NEW_REF"
        
              git tag "$NEW_REF"
        
              git push origin "$NEW_REF"
        
            else
        
              echo "Triggered by Branch."
              echo "Creating branch: $NEW_REF"
        
              git checkout -b "$NEW_REF"
        
              git add dockerfile
        
              git commit \
                -m "chore: secure dockerfile versions via Gemini (Branch: $GITHUB_REF_NAME)"
        
              git push origin "$NEW_REF"
        
            fi
