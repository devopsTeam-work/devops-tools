name: Docker Image CI

on:
  push:
    branches: [ "**" ] # ירוץ על כל push בכל בראנץ'
    tags:
      - '*'
permissions:
  contents: write # שונה ל-write כדי לאפשר לדחוף ברנצ'ים וטאגים חדשים
  security-events: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: show tag name
          run: echo "$GITHUB_REF_NAME"

        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0 # חשוב כדי שנוכל לייצר ברנצ'ים ולדחוף אותם
            token: ${{ secrets.GH_PAT }} # שימוש ב-PAT מורשה שמפעיל Triggers
            
        - name: Set dynamic tag
          run: echo "TAG_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
    
        # התחברות ישירה ל-Docker Hub באמצעות ה-Secrets שלך
        - name: Login to Docker Hub
          run: echo "${{ secrets.DEVOPS_TEAM_PASSWORD }}" | docker login -u "${{ secrets.DEVOPS_TEAM_USERNAME }}" --password-stdin
    
        # בניית האימג' עם השם המלא של ה-Repository שלך ב-Docker Hub
        - name: Build the Docker image
          run: |
            docker build . \
              --file Dockerfile \
              --tag ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:$GITHUB_REF_NAME \
              --tag ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:latest
    
        # דחיפה (Push) של האימג' ל-Docker Hub
        - name: Push Docker image
          if: startsWith(github.ref, 'refs/tags/')
          run: |
            docker push ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:$GITHUB_REF_NAME
            docker push ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:latest
            
        - name: Run Trivy Scanner (SARIF Output)
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: "${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:latest"
            format: 'sarif'
            output: 'trivy-results.sarif'
            severity: 'CRITICAL,HIGH'

        - name: Upload Trivy Results to GitHub Security Tab
          uses: github/codeql-action/upload-sarif@v4
          with:
            sarif_file: 'trivy-results.sarif'

        # ==========================================
        # שלבי התיקון האוטומטי באמצעות Gemini API
        # ==========================================

        - name: Setup Python
          if: ${{ !endsWith(github.ref_name, '_gemini_scan') }}
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Analyze with Gemini API and generate updated Dockerfile
          if: ${{ !endsWith(github.ref_name, '_gemini_scan') }}
          env:
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          run: |
            pip install google-generativeai
            python - << 'EOF'
            import os
            import json
            import time
            import google.generativeai as genai
            from google.api_core.exceptions import ResourceExhausted

            genai.configure(api_key=os.environ["GEMINI_API_KEY"])
            model = genai.GenerativeModel(
                model_name='gemini-3.6-flash',
                tools='google_search'
            )
            with open('dockerfile', 'r') as f:
                dockerfile = f.read()

            # 1. חילוץ תקציר הפגיעויות מתוך ה-SARIF בלבד (מניעת חריגת Tokens)
            # 1. חילוץ כל הפגיעויות מתוך ה-SARIF
            
            vulnerabilities_summary = []
            try:
                with open('trivy-results.sarif', 'r') as f:
                    sarif_data = json.load(f)
                    for run in sarif_data.get('runs', []):
                        for result in run.get('results', []):
                            rule_id = result.get('ruleId', '')
                            message = result.get('message', {}).get('text', '')
                            vulnerabilities_summary.append(f"- {rule_id}: {message}")
            except Exception as e:
                print(f"Warning: Could not parse SARIF file: {e}")

            # הסרת כפילויות תוך שמירה על הסדר ושליחת הכל לסוכן
            unique_vulnerabilities = list(dict.fromkeys(vulnerabilities_summary))
            vuln_text = "\n".join(unique_vulnerabilities) if unique_vulnerabilities else "No critical vulnerabilities found."
           
            # === הדפסת הטקסט שנשלח לג'מיני לתוך ה-Logs של ה-Runner ===
            print("==================================================")
            print("=== Vulnerabilities Summary Sent to Gemini API ===")
            print("==================================================")
            print(vuln_text)
            print("==================================================\n")

            prompt = f"""
            You are a Senior DevOps & Cyber Security Engineer.
            Your task: Update the provided Dockerfile to fix the reported Trivy vulnerabilities BY ONLY UPDATING PACKAGE OR BASE IMAGE VERSIONS.

            MANDATORY REAL-TIME VERIFICATION VIA GOOGLE SEARCH:
            For EVERY package or base image version you decide to update, you MUST search the web in real-time to verify:
            1. CVE REMEDIATION: Search the CVE/vulnerability database to confirm that the target version SPECIFICALLY fixes the reported vulnerability.
            2. EXISTENCE IN REGISTRY: Confirm that the proposed version tag actually exists in the official repository (e.g., Docker Hub, Ubuntu APT, Alpine APK, GitHub Releases).
            3. STABILITY & LTS: Confirm the version is an official STABLE / Long-Term Support (LTS) release. NEVER use short-term interim releases (e.g., Ubuntu 24.10, 23.10) that reach End-of-Life and fail `apt-get update`. Always stick to LTS versions (e.g., Ubuntu 24.04, 22.04, or `latest`).

            STRICT EXECUTION RULES:
            - DO NOT alter, add, or delete any instructions, commands, logic, or environment variables in the Dockerfile.
            - ONLY change version numbers/tags.
            - Output ONLY the raw updated Dockerfile. Do NOT include markdown code fences (like ```dockerfile) or any explanations.

            Dockerfile:
            {dockerfile}

            Vulnerabilities Summary:
            {vuln_text}
            """

            
            # 2. מנגנון ניסיונות חוזרים (Retry) במקרה של Rate Limit
            output = ""
            for attempt in range(3):
                try:
                    response = model.generate_content(prompt)
                    output = response.text.strip()
                    break
                except ResourceExhausted:
                    print(f"Rate limit hit. Retrying in 45 seconds (Attempt {attempt + 1}/3)...")
                    time.sleep(45)

            if not output:
                raise Exception("Failed to get response from Gemini API due to quota limits.")

            # ניקוי סימני Markdown במידה והוחזרו
            if output.startswith("```"):
                lines = output.split("\n")
                output = "\n".join(lines[1:-1])

            with open('dockerfile.new', 'w') as f:
                f.write(output)
            EOF
            
        - name: Diff, Commit and Push changes
          if: ${{ !endsWith(github.ref_name, '_gemini_scan') }}
          run: |
            echo "=== Diff between Original and Gemini's Suggestion ==="
            diff -u dockerfile dockerfile.new || true
            
            # 1. בדיקה אם קיימים שינויים בכלל - אם הקבצים זהים, נעצור ללא push
            if cmp -s dockerfile dockerfile.new; then
              echo "No version updates suggested by Gemini. Exiting."
              exit 0
            fi
            
            # 2. דריסת הקובץ המקורי עם ה-Dockerfile המעודכן
            mv dockerfile.new dockerfile
            
            # 3. הגדרת משתמש Git (הבוט של GitHub Actions)
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            NEW_REF="${GITHUB_REF_NAME}_gemini_scan"
            
            # 4. לוגיקת Push (הפרדה בין Push של Tag ל-Push של Branch)
            if [[ $GITHUB_REF == refs/tags/* ]]; then
              echo "Triggered by Tag. Creating new branch and tag: $NEW_REF"
              git checkout -b "$NEW_REF"
              git add dockerfile
              git commit -m "chore: secure dockerfile versions via Gemini (Tag: $GITHUB_REF_NAME)"
              git push origin "$NEW_REF"
              git tag "$NEW_REF"
              git push origin "$NEW_REF"
            else
              echo "Triggered by Branch. Creating new branch: $NEW_REF"
              git checkout -b "$NEW_REF"
              git add dockerfile
              git commit -m "chore: secure dockerfile versions via Gemini (Branch: $GITHUB_REF_NAME)"
              git push origin "$NEW_REF"
            fi
