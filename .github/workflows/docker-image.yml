name: Docker Image CI

on:
  push:
    branches: [ "**" ] # ירוץ על כל push בכל בראנץ'
    tags:
      - '*'
permissions:
  contents: write # שונה ל-write כדי לאפשר לדחוף ברנצ'ים וטאגים חדשים
  security-events: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: show tag name
          run: echo "$GITHUB_REF_NAME"

        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0 # חשוב כדי שנוכל לייצר ברנצ'ים ולדחוף אותם
            token: ${{ secrets.GH_PAT }} # שימוש ב-PAT מורשה שמפעיל Triggers
            
        - name: Set dynamic tag
          run: echo "TAG_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
    
        # התחברות ישירה ל-Docker Hub באמצעות ה-Secrets שלך
        - name: Login to Docker Hub
          run: echo "${{ secrets.DEVOPS_TEAM_PASSWORD }}" | docker login -u "${{ secrets.DEVOPS_TEAM_USERNAME }}" --password-stdin
    
        # בניית האימג' עם השם המלא של ה-Repository שלך ב-Docker Hub
        - name: Build the Docker image
          run: |
            docker build . \
              --file Dockerfile \
              --tag ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:$GITHUB_REF_NAME \
              --tag ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:latest
    
        # דחיפה (Push) של האימג' ל-Docker Hub
        - name: Push Docker image
          if: startsWith(github.ref, 'refs/tags/')
          run: |
            docker push ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:$GITHUB_REF_NAME
            docker push ${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:latest
            
        - name: Run Trivy Scanner (SARIF Output)
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: "${{ secrets.DEVOPS_TEAM_USERNAME }}/devops-tools:latest"
            format: 'sarif'
            output: 'trivy-results.sarif'
            severity: 'CRITICAL,HIGH'

        - name: Upload Trivy Results to GitHub Security Tab
          uses: github/codeql-action/upload-sarif@v4
          with:
            sarif_file: 'trivy-results.sarif'

        # ==========================================
        # שלבי התיקון האוטומטי באמצעות Gemini API
        # ==========================================

        - name: Setup Python
          if: ${{ !endsWith(github.ref_name, '_gemini_scan') }}
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Analyze with Gemini API and generate updated Dockerfile
          if: ${{ !endsWith(github.ref_name, '_gemini_scan') }}
          env:
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          run: |
            pip install google-genai
            python -u - << 'EOF'
            import os
            import json
            import time
            from google import genai
            from google.genai.errors import APIError

            # אתחול הלקוח עם הספרייה המודרנית google-genai
            client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

            with open('dockerfile', 'r') as f:
                current_dockerfile = f.read()

            # 1. חילוץ וצימצום חכם של ה פגיעויות (Aggregation)
            vuln_map = {}
            try:
                with open('trivy-results.sarif', 'r') as f:
                    sarif_data = json.load(f)
                    for run in sarif_data.get('runs', []):
                        for result in run.get('results', []):
                            rule_id = result.get('ruleId', 'UNKNOWN')
                            message = result.get('message', {}).get('text', '')
                            
                            # קיבוץ לפי Rule ID למניעת כפילויות טוקנים
                            if rule_id not in vuln_map:
                                vuln_map[rule_id] = message
            except Exception as e:
                print(f"Warning: Could not parse SARIF file: {e}")

            # יצירת תמצית מרוכזת של כל הפגיעויות הייחודיות
            aggregated_vulnerabilities = [f"- {rule_id}: {msg}" for rule_id, msg in vuln_map.items()]
            total_unique = len(aggregated_vulnerabilities)

            print("==================================================")
            print(f"Raw Vulnerabilities Parsed: {total_unique} Unique Rules/CVEs")
            print("==================================================\n")

            if not aggregated_vulnerabilities:
                aggregated_vulnerabilities = ["No critical vulnerabilities found."]

            # 2. חלוקה למנות אופטימליות (30 פגיעויות ייחודיות למנה)
            CHUNK_SIZE = 30
            chunks = [aggregated_vulnerabilities[i:i + CHUNK_SIZE] for i in range(0, len(aggregated_vulnerabilities), CHUNK_SIZE)]
            total_chunks = len(chunks)

            # 3. לולאת עיבוד מול ה-API
            for idx, chunk in enumerate(chunks, 1):
                vuln_text = "\n".join(chunk)
                print(f"--- Processing Batch {idx}/{total_chunks} ({len(chunk)} unique issue types) ---")

                prompt = f"""
                You are a Senior DevOps & Cyber Security Engineer.
                Your task: Update the provided Dockerfile to fix the reported Trivy vulnerabilities BY ONLY UPDATING PACKAGE OR BASE IMAGE VERSIONS.

                STRICT VERSION & STABILITY RULES:
                1. BASE IMAGE STABILITY:
                   - You MUST ONLY use Long-Term Support (LTS) base images (e.g., `ubuntu:24.04`, `ubuntu:22.04`, or `ubuntu:latest`).
                   - NEVER upgrade to non-LTS / short-term releases (such as Ubuntu 24.10, 23.10, 23.04) because they reach End-of-Life (EOL) quickly and break `apt-get update` with 404 errors.
                   - For Alpine, Debian, or other OS base images, strictly use official stable/LTS tags.
                2. PACKAGE UPDATES:
                   - Ensure proposed package/image versions are real, existing, stable releases.
                   - Ensure versions explicitly address and remediate the reported CVEs.
                3. EXECUTION CONSTRAINTS:
                   - DO NOT alter, add, or delete any instructions, commands, logic, or environment variables in the Dockerfile.
                   - ONLY change version numbers/tags.
                   - Output ONLY the raw updated Dockerfile. Do NOT include markdown code fences (like ```dockerfile) or any explanations.

                Current Dockerfile Stage:
                {current_dockerfile}

                Vulnerabilities to fix in this stage:
                {vuln_text}
                """

                # ניסיונות חוזרים עם המתנה מדורגת
                batch_success = False
                for attempt in range(4):
                    try:
                        response = client.models.generate_content(
                            model='gemini-2.6-flash',
                            contents=prompt
                        )
                        output = response.text.strip()

                        # ניקוי Markdown במידה והוחזר
                        if output.startswith("```"):
                            lines = output.split("\n")
                            output = "\n".join(lines[1:-1])

                        if output:
                            current_dockerfile = output
                            batch_success = True
                            print(f"✓ Batch {idx}/{total_chunks} completed successfully.")
                            break

                    except APIError as e:
                        wait_time = (attempt + 1) * 40
                        print(f"API Error / Quota hit: {e}. Retrying Batch {idx} in {wait_time}s (Attempt {attempt + 1}/4)...")
                        time.sleep(wait_time)
                    except Exception as e:
                        print(f"Unexpected error on Batch {idx}: {e}")
                        time.sleep(15)

                if not batch_success:
                    raise Exception(f"Failed to process Batch {idx}/{total_chunks} due to API limits or errors.")

                if idx < total_chunks:
                    print("Cooling down for 20 seconds to respect API rate limits...")
                    time.sleep(20)

            # שמירת הקובץ המעודכן
            with open('dockerfile.new', 'w') as f:
                f.write(current_dockerfile)

            print("\n==================================================")
            print("Successfully processed ALL vulnerabilities!")
            print("==================================================")
            EOF
            
        - name: Diff, Commit and Push changes
          if: ${{ !endsWith(github.ref_name, '_gemini_scan') }}
          run: |
            echo "=== Diff between Original and Gemini's Suggestion ==="
            diff -u dockerfile dockerfile.new || true
            
            # 1. בדיקה אם קיימים שינויים בכלל - אם הקבצים זהים, נעצור ללא push
            if cmp -s dockerfile dockerfile.new; then
              echo "No version updates suggested by Gemini. Exiting."
              exit 0
            fi
            
            # 2. דריסת הקובץ המקורי עם ה-Dockerfile המעודכן
            mv dockerfile.new dockerfile
            
            # 3. הגדרת משתמש Git (הבוט של GitHub Actions)
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            NEW_REF="${GITHUB_REF_NAME}_gemini_scan"
            
            # 4. לוגיקת Push (הפרדה בין Push של Tag ל-Push של Branch)
            if [[ $GITHUB_REF == refs/tags/* ]]; then
              echo "Triggered by Tag. Creating new branch and tag: $NEW_REF"
              git checkout -b "$NEW_REF"
              git add dockerfile
              git commit -m "chore: secure dockerfile versions via Gemini (Tag: $GITHUB_REF_NAME)"
              git push origin "$NEW_REF"
              git tag "$NEW_REF"
              git push origin "$NEW_REF"
            else
              echo "Triggered by Branch. Creating new branch: $NEW_REF"
              git checkout -b "$NEW_REF"
              git add dockerfile
              git commit -m "chore: secure dockerfile versions via Gemini (Branch: $GITHUB_REF_NAME)"
              git push origin "$NEW_REF"
            fi
